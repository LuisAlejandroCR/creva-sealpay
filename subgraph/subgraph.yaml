specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AttestationRegistry
    network: sepolia
    source:
      abi: AttestationRegistry
      address: "0xd1463a75aad032659323262ade7906b41c18cc1b"
      startBlock: 11650277
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FolioAttestation
        - Attestation
      abis:
        - name: AttestationRegistry
          file: ./abis/AttestationRegistry.json
      eventHandlers:
        - event: Attested(indexed bytes32,indexed address,uint256)
          handler: handleAttested
      file: ./src/mapping.ts
